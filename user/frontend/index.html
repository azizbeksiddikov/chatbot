<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini AI Assistant</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="header-content">
          <div class="logo-area">
            <span class="sparkle-icon">✨</span>
            <h1>Gemini Assistant</h1>
          </div>
          <nav class="tabs" role="tablist">
            <button
              type="button"
              class="tab-btn active"
              role="tab"
              id="tab-files"
              aria-selected="true"
              data-tab="files"
            >
              <span class="tab-label">Files</span
              ><span
                class="tab-count"
                id="tab-files-count"
                aria-hidden="true"
              ></span>
            </button>
            <button
              type="button"
              class="tab-btn"
              role="tab"
              id="tab-chat"
              aria-selected="false"
              data-tab="chat"
            >
              <span class="tab-label">Chat</span
              ><span
                class="tab-count"
                id="tab-chat-count"
                aria-hidden="true"
              ></span>
            </button>
          </nav>
          <div class="controls-area">
            <label for="model-select" class="control-label">Model</label>
            <select
              id="model-select"
              class="control-select"
              aria-label="Select AI model"
            >
              <option value="">Loading…</option>
            </select>
            <label for="mode-select" class="control-label">Mode</label>
            <select
              id="mode-select"
              class="control-select"
              aria-label="Instruction mode"
            >
              <option value="neutral_assistant">Neutral Assistant</option>
              <option value="detailed_researcher">Detailed Researcher</option>
              <option value="concise_analyzer">Concise Analyzer</option>
            </select>
            <button id="clear-btn" class="clear-button">Clear Chat</button>
          </div>
        </div>
      </header>

      <!-- Files tab -->
      <section
        class="tab-panel active"
        id="files-panel"
        role="tabpanel"
        aria-labelledby="tab-files"
      >
        <div class="files-container">
          <div class="upload-area">
            <label class="upload-label" for="file-input">
              <span class="upload-icon" aria-hidden="true">📎</span>
              <span>Drop files or click to upload</span>
              <span class="upload-hint">PDF, TXT, DOC, MD, CSV</span>
            </label>
            <input
              type="file"
              id="file-input"
              multiple
              accept=".pdf,.txt,.doc,.docx,.md,.csv"
            />
          </div>
          <div class="file-list-wrap">
            <p class="file-list-empty" id="file-list-empty">
              No documents yet. Upload files above to search over them in Chat.
            </p>
            <div class="file-list" id="file-list"></div>
          </div>
        </div>
      </section>

      <!-- Chat tab -->
      <section
        class="tab-panel"
        id="chat-panel"
        role="tabpanel"
        aria-labelledby="tab-chat"
        hidden
      >
        <main class="chat-container">
          <div class="chat-history" id="chat-history">
            <div class="message ai-message">
              <div class="avatar">AI</div>
              <div class="content-wrapper">
                <div class="content">
                  Hello! I'm your Gemini AI assistant. Upload files in the Files
                  tab, then ask anything about them here.
                </div>
              </div>
            </div>
          </div>
        </main>
        <footer class="input-container">
          <p
            class="files-active-hint"
            id="files-active-hint"
            aria-live="polite"
          >
            No files in context. Add documents in the Files tab.
          </p>
          <div class="input-wrapper">
            <form id="chat-form">
              <textarea
                id="user-input"
                placeholder="Ask anything about your documents..."
                rows="1"
                autocomplete="off"
              ></textarea>
              <button type="submit" class="send-button" id="send-btn">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </form>
          </div>
        </footer>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
