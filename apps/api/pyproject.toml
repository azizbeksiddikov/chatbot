[project]
name = "chatbot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.2.0",
    "httpx>=0.28.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # LLM & AI
    "google-genai>=1.0.0",
    "groq>=0.15.0",
    "mistralai>=1.5.0",

    # Document processing
    "PyMuPDF>=1.25.0",
    "python-pptx>=1.0.0",

    # Storage (S3/R2 compatible)
    "boto3>=1.36.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
