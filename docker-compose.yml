# Prod: admin + user containers only. Your nginx routes to these ports.
# Env: host .env is mounted as .env inside the container; app always uses .env.
# Admin:  http://localhost:5010/  (and /chatbot_admin/, /api/)
# User:   http://localhost:5011/  (and /api/)
services:
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: chatbot-admin:latest
    container_name: chatbot-admin
    ports:
      - "5010:5006"
    volumes:
      - ./.env:/app/.env
      - ./admin/files:/app/admin/files
    restart: unless-stopped
    networks:
      - app

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    image: chatbot-user:latest
    container_name: chatbot-user
    ports:
      - "5011:5000"
    volumes:
      - ./.env:/app/.env
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
